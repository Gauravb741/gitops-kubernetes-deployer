---
# ── Docker Compose — local development & testing ──────────────────────────────
# Usage: docker compose up --build
# The application will be available at http://localhost:8080

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: kubernetes-gitops-demo:local
    container_name: gitops-demo-app
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "kubernetes-gitops-demo"
      APP_VERSION: "1.0.0"
      APP_ENV: "docker-compose"
      POD_NAME: "docker-compose-pod"
      PORT: "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - gitops-network
    labels:
      app: "kubernetes-gitops-demo"
      version: "1.0.0"
      managed-by: "docker-compose"

networks:
  gitops-network:
    driver: bridge
    name: gitops-demo-net