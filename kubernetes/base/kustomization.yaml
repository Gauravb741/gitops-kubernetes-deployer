apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: gitops-demo-base

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # secret-example.yaml is intentionally excluded from default apply
  # Apply secrets separately using a secrets management tool

commonLabels:
  project: kubernetes-gitops-deployment
  managed-by: kustomize