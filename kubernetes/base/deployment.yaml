apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: gitops-demo
  labels:
    app: gitops-demo
    managed-by: kustomize
  annotations:
    # Argo CD will update this annotation during sync
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Allow one extra pod during update
      maxUnavailable: 0  # Never reduce below desired replicas
  template:
    metadata:
      labels:
        app: gitops-demo
      annotations:
        # Forces pod restart when ConfigMap changes
        checksum/config: "placeholder"
    spec:
      # ── Security context (pod level) ────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # ── Graceful shutdown ─────────────────────────────────────
      terminationGracePeriodSeconds: 30

      containers:
        - name: gitops-demo
          # Image tag is managed by Kustomize image replacement in overlays
          image: ghcr.io/owner/kubernetes-gitops-deployment:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment from ConfigMap ───────────────────────
          envFrom:
            - configMapRef:
                name: gitops-demo-config

          # ── Additional env vars ──────────────────────────────
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # ── Resource management ──────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # ── Startup probe (gives app time to initialise) ─────
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 3

          # ── Liveness probe (restart if unhealthy) ────────────
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness probe (route traffic only when ready) ──
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ── Container security context ───────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # gunicorn needs /tmp
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL