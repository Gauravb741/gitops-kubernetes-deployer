---
# ── SECRET EXAMPLE ────────────────────────────────────────────────────────────
# This file demonstrates Kubernetes Secret structure.
# NEVER commit real credentials to Git.
#
# In production, use one of:
#   - External Secrets Operator (fetches from Vault / AWS Secrets Manager)
#   - Sealed Secrets (encrypted secrets safe to commit)
#   - SOPS (Mozilla)
#   - Argo CD Vault Plugin
#
# To create a real secret manually:
#   kubectl create secret generic gitops-demo-secret \
#     --from-literal=DATABASE_URL='postgresql://...' \
#     --namespace gitops-demo
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: gitops-demo-secret
  namespace: gitops-demo
  labels:
    app: gitops-demo
    managed-by: kustomize
  annotations:
    note: "Replace placeholder values before applying to any real environment"
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:REPLACE_ME@db:5432/appdb"
  SECRET_KEY: "REPLACE_ME_WITH_REAL_SECRET"
  API_TOKEN: "REPLACE_ME_WITH_REAL_TOKEN"