---
# ── Argo CD Application Manifest ──────────────────────────────────────────────
# Deploys the GitOps demo application using the local overlay.
#
# Apply with:
#   kubectl apply -f argocd/application.yaml -n argocd
#
# Prerequisites:
#   - Argo CD installed in the argocd namespace
#   - The repository is accessible (public or credentials configured)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
  labels:
    project: kubernetes-gitops-deployment
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/kubernetes-gitops-deployment.git
    targetRevision: HEAD
    path: kubernetes/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas