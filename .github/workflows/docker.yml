---
name: Docker — Build & Push

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      sha-tag: ${{ steps.sha-tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Convert repository name to lowercase ──────────────────
      # GHCR requires fully lowercase image names.
      # github.repository may contain uppercase letters (e.g. Gauravb741/repo)
      - name: Compute lowercase image name
        id: image-name
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository }}"
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"
          echo "value=${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${IMAGE_NAME_LOWER}"

      - name: Compute immutable SHA tag
        id: sha-tag
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "SHA tag: sha-${SHORT_SHA}"

      # ── Docker Buildx ─────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GHCR login ────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Generate tags and labels ──────────────────────────────
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.value }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Build image locally for scanning (no push yet) ────────
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-name.outputs.value }}:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy vulnerability scan ──────────────────────────────
      - name: Scan image with Trivy
        id: trivy-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-name.outputs.value }}:scan-target
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
        continue-on-error: true

      # ── Upload Trivy SARIF (only if file exists) ──────────────
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      # ── Build and push to GHCR ────────────────────────────────
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── Summary ───────────────────────────────────────────────
      - name: Print image details
        run: |
          echo "## Docker Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.image-name.outputs.value }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA Tag | \`${{ steps.sha-tag.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Digest | \`${{ steps.build.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"