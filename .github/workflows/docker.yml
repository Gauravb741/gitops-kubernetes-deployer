# ── Docker Workflow — Build, Scan, Push ──────────────────────────────────────
# Builds the Docker image on every push to main.
# Scans with Trivy, then pushes to GHCR with immutable SHA tag.
# ─────────────────────────────────────────────────────────────────────────────

name: Docker — Build & Push

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # Allow manual trigger

permissions:
  contents: read
  packages: write      # Required to push to GHCR
  security-events: write  # Required for Trivy SARIF upload

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
      sha-tag: ${{ steps.sha-tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Buildx ─────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── GHCR authentication ───────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Compute tags ──────────────────────────────────────────────────────
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute immutable SHA tag
        id: sha-tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ── Build image (no push yet — scan first) ────────────────────────────
      - name: Build Docker image (cache only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Vulnerability scan ────────────────────────────────────────────────
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan-target
          format: "sarif"
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # Don't fail build on findings; report only

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ── Build and push ────────────────────────────────────────────────────
      - name: Build and push Docker image to GHCR
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Print image details
        run: |
          echo "Image digest : ${{ steps.build.outputs.digest }}"
          echo "SHA tag      : ${{ steps.sha-tag.outputs.tag }}"
          echo "All tags     :"
          echo "${{ steps.meta.outputs.tags }}"